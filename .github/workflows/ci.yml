name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the repository and nothing else.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Type check
        run: npm run typecheck
      - name: Unit, export and pipeline tests
        run: npm test
      - name: Equation checks (SymPy + Pint)
        run: npm run test:equations
      - name: Build the full sample book (every KDP check and EPUBCheck must pass)
        run: npm run build -- examples/rc-circuits --strict --epubcheck
      - name: Build the gallery samples (one chapter each, so allowed under 24 pages)
        run: npm run build:all -- --strict --allow-short --epubcheck
      - name: Rendered assets are up to date
        run: npm run assets:check
      - name: Build the web app
        run: npm run app:build
      - name: Dependency audit (high severity and above)
        run: npm audit --audit-level=high --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: sample-books
          path: dist/

  desktop:
    # Compiles the Tauri shell, lints it and runs its unit tests (installers are built by release.yml).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - name: Placeholder frontend (tauri::generate_context! needs web/dist to exist)
        run: mkdir -p web/dist && echo '<!doctype html><title>Scriptorium</title>' > web/dist/index.html
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  references:
    # Re-checks every DOI against Crossref. Network-dependent, so it does not block merges.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify-refs

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links in docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --accept 200,403,429 README.md docs/*.md CONTRIBUTING.md SECURITY.md
          fail: true
