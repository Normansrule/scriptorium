name: Release desktop app
# Push a tag such as v0.4.0 to build installers for Linux, Windows and macOS,
# publish them with SHA-256 checksums, and attach build-provenance attestations
# (verify with: gh attestation verify <file> --repo Normansrule/scriptorium).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - run: npm ci
      - name: Build installers
        run: npm run desktop:build
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) \
            -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation (Sigstore)
      attestations: write  # store the attestation
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: installers-*
          merge-multiple: true
      - name: SHA-256 checksums
        working-directory: out
        run: sha256sum * | tee SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'out/*'
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Scriptorium $GITHUB_REF_NAME" \
            --notes "Desktop installers for Linux (.deb, .rpm, .AppImage), Windows (.msi, setup .exe) and macOS (.dmg). Check a download with \`sha256sum -c SHA256SUMS.txt --ignore-missing\` and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`. The installers are not code-signed yet, so Windows SmartScreen and macOS Gatekeeper will warn on first launch."
