version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    ignore:
      # pint 0.26 does not install on Python 3.11 (checked); the README supports Python 3.10+.
      - dependency-name: pint
        versions: ['>=0.26']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
