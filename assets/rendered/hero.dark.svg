<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d" font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Scriptorium: from a topic to a finished book</title>
<desc id="d">Animation: a topic is typed, an outline appears and is approved, a page fills with text, an equation and a drawn charging curve with verified sources, and the book is exported as a web book, a KDP-ready print PDF with cover, and an EPUB 3 ebook.</desc>
