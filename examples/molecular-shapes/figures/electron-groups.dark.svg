<title id="t">Four electron groups spread out in 3D</title>
<desc id="d">Left: a central carbon with four bonds to hydrogen in a flat square, 90 degrees apart. Right: the same four bonds arranged as a tetrahedron, drawn with a wedge towards the reader and dashes away from the reader, 109.5 degrees apart.</desc>
